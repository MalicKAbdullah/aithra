name: Device test

# Launch smoke and integration test on an emulator. GitHub's runners cannot
# run an arm64 emulator (the arm64 Linux runners have no KVM, the macOS ones
# cannot nest virtualization), so this builds the same app for x86_64; the
# crashes it guards against are in Dart and Kotlin, not in the ABI.
on:
  workflow_call:

jobs:
  device:
    name: Launch smoke and integration test (x86_64 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_aithraAbi: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build x86_64 release APK
        run: flutter build apk --release --target-platform android-x64
      # The integration test runs as an Android instrumentation test, so it
      # needs no flutter_tools or Dart Development Service connection to the
      # emulator. Built here so the emulator step only installs and runs.
      # The release build above generates a plugin registrant without
      # dev-dependency plugins; the debug config-only pass regenerates it with
      # integration_test, which reports the Dart results to the test runner.
      - name: Build x86_64 integration test APKs
        run: |
          flutter build apk --debug --config-only
          android/gradlew -p android app:assembleDebug app:assembleDebugAndroidTest \
            -Ptarget=$PWD/integration_test/app_test.dart -Ptarget-platform=android-x64
      - name: Launch smoke and integration test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 60
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            .github/scripts/launch_smoke.sh build/app/outputs/flutter-apk/app-release.apk
            .github/scripts/integration_test.sh -Ptarget-platform=android-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: |
            launch-logcat.txt
            launch-screen.png
            test-logcat.txt
            test-screen.png
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: ignore
